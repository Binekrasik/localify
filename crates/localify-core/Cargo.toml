[package]
name = "localify-core"
version = "0.1.0"
edition = "2024"
description = "Metadata, cover and accent-colour extraction for localify, compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
# The default `id3v2_compression_support` feature stays on: lofty 0.25.5 does not compile without it.
lofty = "0.25"
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Blob", "File", "FileReaderSync"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
